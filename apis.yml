name: Chase UK
kind: company
description: >-
  Chase UK is the digital retail bank operated in the United Kingdom by J.P.
  Morgan Europe Limited, a wholly owned subsidiary of JPMorgan Chase & Co. that
  launched the Chase consumer brand in the UK in September 2021. It is an
  app-only challenger bank with no physical branches or ATM estate, offering
  current accounts, savings, and round-up features to personal customers, and
  is authorised and regulated in the UK by the Financial Conduct Authority (FCA)
  and the Prudential Regulation Authority (PRA). As a Payment Services
  Regulations 2017 account provider (ASPSP), Chase UK operates a dedicated Open
  Banking interface conformant to the UK Open Banking Implementation Entity
  (OBIE) Read/Write API Standard, exposing Account Information (AIS), Payment
  Initiation (PIS), and Confirmation of Funds (CBPII) services to FCA-authorised
  third-party providers. It is not one of the CMA9 mandated banks; access is
  granted through its developer sandbox and secured with FAPI-grade OAuth2/OIDC,
  PSD2 strong customer authentication, and mutual-TLS using eIDAS QWAC or OBWAC
  certificates from the Open Banking Certificate Authority.
