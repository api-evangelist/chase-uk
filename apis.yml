apis:
- aid: chase-uk:chase-uk-account-information-api
  name: Chase UK Account and Transaction Information API (AIS)
  description: >-
    Chase UK's Account Information Service (AIS) dedicated interface, conformant
    to the OBIE Read/Write API Standard, letting FCA-authorised AISPs retrieve a
    consenting customer's account, balance, transaction, beneficiary, standing
    order, direct debit, and statement data. Access is gated behind developer
    onboarding and secured with FAPI OAuth2/OIDC, PSD2 SCA, and mutual-TLS. The
    referenced OpenAPI is the shared OBIE standard specification (v4.0.1), not a
    Chase-proprietary contract.
  humanURL: https://developer.openbanking-obie-sandbox.chase.co.uk/docs/
  tags:
  - Account Information
  - AISP
  - Open Banking
  properties:
  - type: OpenAPI
    url: openapi/obie-account-info-openapi.yaml
  - type: Documentation
    url: https://developer.openbanking-obie-sandbox.chase.co.uk/docs/
  - type: Documentation
    url: https://www.chase.co.uk/gb/en/information-for-tpps/
  - type: DeveloperPortal
    url: https://developer.openbanking-obie-sandbox.chase.co.uk/
- aid: chase-uk:chase-uk-payment-initiation-api
  name: Chase UK Payment Initiation API (PIS)
  description: >-
    Chase UK's Payment Initiation Service (PIS) dedicated interface, conformant
    to the OBIE Read/Write API Standard, enabling FCA-authorised PISPs to create
    single immediate payments, future-dated payments, and standing orders to UK
    accounts on behalf of a consenting customer. Access is gated behind developer
    onboarding and secured with FAPI OAuth2/OIDC, PSD2 SCA, and mutual-TLS. The
    referenced OpenAPI is the shared OBIE standard specification (v4.0.1), not a
    Chase-proprietary contract.
  humanURL: https://developer.openbanking-obie-sandbox.chase.co.uk/docs/
  tags:
  - Payment Initiation
  - PISP
  - Payments
  properties:
  - type: OpenAPI
    url: openapi/obie-payment-initiation-openapi.yaml
  - type: Documentation
    url: https://developer.openbanking-obie-sandbox.chase.co.uk/docs/
  - type: Documentation
    url: https://www.chase.co.uk/gb/en/information-for-tpps/
  - type: DeveloperPortal
    url: https://developer.openbanking-obie-sandbox.chase.co.uk/
- aid: chase-uk:chase-uk-confirmation-of-funds-api
  name: Chase UK Confirmation of Funds API (CBPII)
  description: >-
    Chase UK's Confirmation of Funds (CBPII) dedicated interface, conformant to
    the OBIE Read/Write API Standard, allowing an FCA-authorised card-based
    payment instrument issuer to check whether a specified amount is available on
    a consenting customer's account. Access is gated behind developer onboarding
    and secured with FAPI OAuth2/OIDC, PSD2 SCA, and mutual-TLS. The referenced
    OpenAPI is the shared OBIE standard specification (v4.0.1), not a
    Chase-proprietary contract.
  humanURL: https://developer.openbanking-obie-sandbox.chase.co.uk/docs/
